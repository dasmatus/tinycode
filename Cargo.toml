[package]
name = "tinycode"
version = "0.1.0"
edition = "2021"
description = "A minimal, resource-efficient coding agent CLI, meant to be driven from T3 Code."
license = "AGPL-3.0-or-later"
repository = "https://github.com/dasmatus/tinycode"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
# ACP support
agent-client-protocol = "0.4"
tokio = { version = "1", features = ["full", "rt-multi-thread", "io-std", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
schemars = "0.8"

[profile.release]
# Size-focused per the Rust Performance Book.
# opt-level="z" + LTO + panic=abort + strip keeps the musl binary small.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
