[package]
name = "tinycode"
version = "0.1.0"
edition = "2021"
description = "A minimal, resource-efficient coding agent CLI, meant to be driven from T3 Code."

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
