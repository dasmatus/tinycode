[package]
name = "tinycode"
version = "0.1.0"
edition = "2021"
description = "A minimal, resource-efficient coding agent CLI, meant to be driven from T3 Code."
license = "AGPL-3.0-or-later"
repository = "https://github.com/dasmatus/tinycode"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
# Size-focused per the Rust Performance Book.
# opt-level="z" + LTO + panic=abort + strip keeps the musl binary small.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
